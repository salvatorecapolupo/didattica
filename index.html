<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Ops... la pagina è stata spostata ! </title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f9fa;
      text-align: center;
    }
    .landing-container {
      max-width: 500px;
    }
    .btn-main {
      font-size: 1.5rem;
      padding: 1rem 2rem;
    }
    .countdown {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #555;
    }
  </style>
  <script>
    // Redirect dopo 10 secondi
    let seconds = 10;
    function updateCountdown() {
      document.getElementById('countdown').innerText = seconds;
      if(seconds === 0) {
        window.location.href = "https://salvatorecapolupo.github.io/about-me/";
      } else {
        seconds--;
        setTimeout(updateCountdown, 1000);
      }
    }
    window.onload = updateCountdown;
  </script>
</head>
<body>
  <div class="landing-container">
    <h1 class="mb-4">Benvenuto!</h1>
    <p class="mb-4">Link per visitare la pagina che stavi cercando </p>
    <a href="https://salvatorecapolupo.github.io/about-me/" class="btn btn-primary btn-main"> Clicca qui per accedere </a>
    <div class="countdown">Oppure attendi <span id="countdown">10</span> secondi</div>
  </div>
</body>
</html>
